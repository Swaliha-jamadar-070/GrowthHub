# Application
spring.application.name=roadmap-tracker
server.port=8081

# Database Configuration (RENDER'S DATABASE)
# Note: Render ${SPRING_DATASOURCE_URL} automatically replaces with the Env Variable you set
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# CORS (Updated for LIVE Frontend URL)
# NOTE: Change http://localhost:3001 to your ACTUAL Vercel URL later!
spring.web.cors.allowed-origins=http://localhost:3001
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Logging
logging.level.com.roadmap=DEBUG
logging.level.org.springframework.security=DEBUG

# Allow circular references
spring.main.allow-circular-references=true