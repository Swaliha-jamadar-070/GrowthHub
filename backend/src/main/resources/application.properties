# Application
spring.application.name=roadmap-tracker
server.port=8081

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/roadmap_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=system
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# JWT Configuration
jwt.secret=your-super-secret-key-for-jwt-token-generation-2026
jwt.expiration=86400000

# CORS
spring.web.cors.allowed-origins=http://localhost:3001
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Logging
logging.level.com.roadmap=DEBUG
logging.level.org.springframework.security=DEBUG

# Allow circular references (temporary fix)
spring.main.allow-circular-references=true